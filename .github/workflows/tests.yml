name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for OpenCV / Qt (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libglib2.0-0 \
            libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download pose model
        run: python scripts/download_models.py
      - name: Run tests
        run: python -m pytest -q
